name: "Checks"
on:
  push:
    paths-ignore:
      - "**.png"
  pull_request:
    paths-ignore:
      - "**.png"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun ci
      - run: bun fmt --check
